<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect width="840" height="400" fill="#ffffff"/>
  <text x="420" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">MTP 接受率 vs 草稿长度 —— 随长度单调下跌，d5 以上是负资产</text>
  <text x="420" y="45" text-anchor="middle" font-size="12" fill="#6b7280">Q2 @ 262K · 接受率 = Σaccepted / Σdrafted（服务端口径）· 低于 50% 线的格子聚合必掉</text>
  <!-- axes -->
  <line x1="70" y1="320" x2="810" y2="320" stroke="#9ca3af"/>
  <line x1="70" y1="40" x2="70" y2="320" stroke="#9ca3af"/>
  <g font-size="11" fill="#6b7280" text-anchor="end">
    <text x="64" y="324">0%</text><text x="64" y="268">25%</text><text x="64" y="212">50%</text><text x="64" y="156">75%</text><text x="64" y="104">100%</text>
  </g>
  <g font-size="12" fill="#374151" text-anchor="middle">
    <text x="90" y="340">d2</text><text x="190" y="340">d3</text><text x="290" y="340">d4</text><text x="390" y="340">d5</text>
    <text x="490" y="340">d6</text><text x="590" y="340">d7</text><text x="690" y="340">d8</text><text x="790" y="340">d9</text>
  </g>
  <!-- 50% danger line -->
  <line x1="70" y1="180" x2="810" y2="180" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="806" y="176" font-size="12" fill="#dc2626" text-anchor="end" font-weight="bold">50% 危险线</text>
  <!-- mc4 line -->
  <polyline points="90,125.4 190,140.5 290,169.9 390,176.6 490,201.6 590,209.1 690,220.6 790,225.4" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <g fill="#2563eb">
    <circle cx="90" cy="125.4" r="4"/><circle cx="190" cy="140.5" r="4"/><circle cx="290" cy="169.9" r="4"/><circle cx="390" cy="176.6" r="4"/>
    <circle cx="490" cy="201.6" r="4"/><circle cx="590" cy="209.1" r="4"/><circle cx="690" cy="220.6" r="4"/><circle cx="790" cy="225.4" r="4"/>
  </g>
  <text x="103" y="118" font-size="12" fill="#2563eb" font-weight="bold">mc4</text>
  <!-- mc5 line -->
  <polyline points="90,119.5 190,151.4 290,161.8 390,193.4 490,203.0 590,200.2 690,229.8 790,237.4" fill="none" stroke="#059669" stroke-width="2.5"/>
  <g fill="#059669">
    <circle cx="90" cy="119.5" r="4"/><circle cx="190" cy="151.4" r="4"/><circle cx="290" cy="161.8" r="4"/><circle cx="390" cy="193.4" r="4"/>
    <circle cx="490" cy="203.0" r="4"/><circle cx="590" cy="200.2" r="4"/><circle cx="690" cy="229.8" r="4"/><circle cx="790" cy="237.4" r="4"/>
  </g>
  <text x="103" y="108" font-size="12" fill="#059669" font-weight="bold">mc5</text>
  <!-- mc6 line -->
  <polyline points="90,120.6 190,140.0 290,154.2 390,184.5 490,188.7 590,221.7 690,229.0 790,241.9" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  <g fill="#7c3aed">
    <circle cx="90" cy="120.6" r="4"/><circle cx="190" cy="140.0" r="4"/><circle cx="290" cy="154.2" r="4"/><circle cx="390" cy="184.5" r="4"/>
    <circle cx="490" cy="188.7" r="4"/><circle cx="590" cy="221.7" r="4"/><circle cx="690" cy="229.0" r="4"/><circle cx="790" cy="241.9" r="4"/>
  </g>
  <text x="60" y="112" font-size="12" fill="#7c3aed" font-weight="bold">mc6</text>
  <!-- annotations -->
  <rect x="80" y="55" width="180" height="34" rx="6" fill="#ecfdf5" stroke="#10b981"/>
  <text x="170" y="77" font-size="13" fill="#065f46" text-anchor="middle" font-weight="bold">d2-d4 安全区 53-80%</text>
  <rect x="580" y="55" width="200" height="34" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="680" y="77" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="bold">d5+ 负资产区 28-48%</text>
</svg>
