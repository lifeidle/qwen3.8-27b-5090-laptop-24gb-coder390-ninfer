<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect width="840" height="400" fill="#ffffff"/>
  <text x="420" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">KV 格式对决：单价越低 → 池越大 → decode 越快（带宽瓶颈）</text>
  <text x="420" y="45" text-anchor="middle" font-size="12" fill="#6b7280">实测单价（Q2 权重 12.6 GiB 下）· decode 是带宽瓶颈：每 token 读的 KV 越少越快</text>
  <!-- rows -->
  <g font-size="13" fill="#374151">
    <text x="150" y="105" text-anchor="end">bf16（默认）</text>
    <text x="150" y="185" text-anchor="end">fp8</text>
    <text x="150" y="265" text-anchor="end">rk8v4</text>
    <text x="150" y="345" text-anchor="end">rk4v4 ★</text>
  </g>
  <!-- bars: 52.7 / 32.6 / 28.6 / 19.0 KB, scale 10px per KB -->
  <rect x="160" y="82" width="527" height="36" rx="4" fill="#9ca3af"/>
  <rect x="160" y="162" width="326" height="36" rx="4" fill="#f59e0b"/>
  <rect x="160" y="242" width="286" height="36" rx="4" fill="#ef4444"/>
  <rect x="160" y="322" width="190" height="36" rx="4" fill="#10b981"/>
  <g font-size="13" fill="#ffffff" font-weight="bold">
    <text x="170" y="106">52.7 KB/tok</text>
    <text x="170" y="186">32.6</text>
    <text x="170" y="266">28.6</text>
  </g>
  <text x="170" y="346" font-size="13" fill="#ffffff" font-weight="bold">19.0</text>
  <!-- pool annotations -->
  <g font-size="12.5" fill="#374151">
    <text x="697" y="106">池 ~64-96K</text>
    <text x="496" y="186">池 ~131-148K</text>
    <text x="456" y="266">池 ~160-176K</text>
    <text x="360" y="346">池 288K ★</text>
  </g>
  <!-- decode annotations -->
  <g font-size="12" fill="#6b7280">
    <text x="697" y="122">decode ~81</text>
    <text x="496" y="202">decode 80.7</text>
    <text x="456" y="282">decode 63.6 ⚠ 接受率腰斩</text>
    <text x="360" y="362">decode 84-86 ★ 接受率 67-74%</text>
  </g>
  <line x1="70" y1="380" x2="810" y2="380" stroke="#e5e7eb"/>
  <text x="420" y="394" text-anchor="middle" font-size="12" fill="#9ca3af">fp8 @ 160K / rk8v4 @ 200K 起无法启动（显存）· rk8v4 的 MTP 接受率腰斩原因待查（疑草稿头读 4-bit V 受损）</text>
</svg>
