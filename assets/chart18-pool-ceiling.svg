<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif">
  <rect width="840" height="400" fill="#ffffff"/>
  <text x="420" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2937">mc6 × d3 的 KV 池天花板探针（+4K 步进，finalizing = 显存爆）</text>
  <text x="420" y="45" text-anchor="middle" font-size="12" fill="#6b7280">「free 0 B」偏保守 —— 262K 显示无余量，实际还能再塞 32K；真实边界必须探针实测</text>
  <!-- axes -->
  <line x1="70" y1="330" x2="810" y2="330" stroke="#9ca3af"/>
  <line x1="70" y1="60" x2="70" y2="330" stroke="#9ca3af"/>
  <g font-size="11" fill="#6b7280" text-anchor="end">
    <text x="64" y="334">260K</text><text x="64" y="278">280K</text><text x="64" y="222">300K</text>
  </g>
  <line x1="70" y1="278" x2="810" y2="278" stroke="#e5e7eb" stroke-dasharray="4 4"/>
  <line x1="70" y1="222" x2="810" y2="222" stroke="#e5e7eb" stroke-dasharray="4 4"/>
  <!-- bars: scale y = 330 - (v-260000)/320000*280 ... use approx: v in K, y=330-(vK-260)*1.4 -->
  <!-- 262.144K -> 297 ; 266.24 -> 291.4 ; 278.528 -> 274.2 ; 294.912 -> 251.6 ; 303.104 -> 240.2 ; 311.296 -> 229 -->
  <g>
    <rect x="100" y="297" width="80" height="33" rx="3" fill="#10b981"/>
    <rect x="210" y="291" width="80" height="39" rx="3" fill="#10b981"/>
    <rect x="320" y="274" width="80" height="56" rx="3" fill="#10b981"/>
    <rect x="430" y="252" width="80" height="78" rx="3" fill="#059669"/>
    <rect x="540" y="240" width="80" height="90" rx="3" fill="#f87171" stroke="#dc2626" stroke-dasharray="5 3"/>
    <rect x="650" y="229" width="80" height="101" rx="3" fill="#f87171" stroke="#dc2626" stroke-dasharray="5 3"/>
  </g>
  <g font-size="12" text-anchor="middle" fill="#065f46" font-weight="bold">
    <text x="140" y="291">✅ 262,144</text><text x="250" y="285">✅ 266,240</text><text x="360" y="268">✅ 278,528</text><text x="470" y="246">✅ 294,912</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#991b1b" font-weight="bold">
    <text x="580" y="234">❌ 303,104</text><text x="690" y="223">❌ 311,296</text>
  </g>
  <!-- ceiling marker -->
  <line x1="410" y1="60" x2="410" y2="330" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="418" y="70" font-size="12.5" fill="#059669" font-weight="bold">实测天花板 ≈ 288K-296K 之间</text>
  <!-- x labels -->
  <g font-size="11.5" fill="#374151" text-anchor="middle">
    <text x="140" y="348">262,144</text><text x="250" y="348">266,240</text><text x="360" y="348">278,528</text>
    <text x="470" y="348">294,912</text><text x="580" y="348">303,104</text><text x="690" y="348">311,296</text>
  </g>
  <text x="420" y="386" text-anchor="middle" font-size="12.5" fill="#1f2937" font-weight="bold">终版配置：max-context 262,144（原生窗）+ 池 294,912（+32K 排队余量）</text>
</svg>
